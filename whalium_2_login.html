<script>
// ── Whalium 全站双语切换库 ────────────────────────────────────
// 每个页面在 <head> 中内联此脚本即可获得切换能力
// 页面设 <html lang="zh-CN"> 或 <html lang="zh-CN"> 决定默认语言
// 按钮加 id="lang-btn" onclick="toggleLang()"

(function () {
  var STORE_KEY = 'whalium_lang';

  // 读取用户上次选择；若无则用页面 html[lang] 属性
  function getDefault() {
    try { var s = localStorage.getItem(STORE_KEY); if (s) return s; } catch(e){}
    return (document.documentElement.lang || 'zh').startsWith('zh') ? 'zh' : 'en';
  }

  // 对页面所有 <span class="t"> 切换显示内容
  function applyLang(lang) {
    var isEn = (lang === 'en');
    // 切换文字
    document.querySelectorAll('span.t').forEach(function(el) {
      el.textContent = isEn ? (el.dataset.en || el.dataset.zh) : (el.dataset.zh || el.dataset.en);
    });
    // 切换 placeholder
    document.querySelectorAll('[data-ph-zh]').forEach(function(el) {
      el.placeholder = isEn ? (el.dataset.phEn || el.dataset.phZh) : el.dataset.phZh;
    });
    // 切换 value (仅 input[data-val-zh])
    document.querySelectorAll('[data-val-zh]').forEach(function(el) {
      el.value = isEn ? (el.dataset.valEn || '') : el.dataset.valZh;
    });
    // 更新按钮文字
    var btn = document.getElementById('lang-btn');
    if (btn) btn.textContent = isEn ? '中文' : 'EN';
    // 存储
    try { localStorage.setItem(STORE_KEY, lang); } catch(e){}
    window._whaliumLang = lang;
  }

  // 切换
  window.toggleLang = function() {
    var cur = window._whaliumLang || getDefault();
    applyLang(cur === 'zh' ? 'en' : 'zh');
  };

  window.applyLang = applyLang;
  window.getCurrentLang = function() { return window._whaliumLang || getDefault(); };

  // 页面加载时执行
  document.addEventListener('DOMContentLoaded', function() {
    applyLang(getDefault());
  });
})();

</script>
<script id="lang-core">(function(){
  var K = 'whalium_lang';

  function detect() {
    try {
      var s = localStorage.getItem(K);
      if (s === 'zh' || s === 'en') return s;
    } catch(e) {}
    return 'zh';
  }

  function apply(lang) {
    var en = (lang === 'en');
    document.querySelectorAll('span.t').forEach(function(el) {
      el.textContent = en ? (el.dataset.en || el.dataset.zh) : (el.dataset.zh || el.dataset.en);
    });
    document.querySelectorAll('[data-ph-zh]').forEach(function(el) {
      el.placeholder = en ? (el.dataset.phEn || el.dataset.phZh) : el.dataset.phZh;
    });
    var btn = document.getElementById('lang-btn');
    if (btn) btn.textContent = en ? '中文' : 'EN';
    document.documentElement.setAttribute('lang', en ? 'en' : 'zh-CN');
    try { localStorage.setItem(K, lang); } catch(e) {}
    window._wlang = lang;
  }

  window.toggleLang = function() { apply(window._wlang === 'zh' ? 'en' : 'zh'); };
  window.applyLang  = apply;
  window._detectLang = detect;
  document.addEventListener('DOMContentLoaded', function() { apply(detect()); });
})();</script>

    <script>
    function togglePw() {
        var input = document.getElementById('password');
        var eye   = document.getElementById('pw-eye');
        if (input.type === 'password') { input.type = 'text'; eye.textContent = '🙈'; }
        else                           { input.type = 'password'; eye.textContent = '👁'; }
    }

    function showMsg(text, type) {
        var el = document.getElementById('login-msg');
        el.style.display = 'block';
        el.style.background = type === 'error' ? 'rgba(204,34,51,0.08)' : 'rgba(0,153,170,0.08)';
        el.style.color      = type === 'error' ? '#cc2233' : '#006e8a';
        el.style.border     = '1px solid ' + (type === 'error' ? 'rgba(204,34,51,0.2)' : 'rgba(0,153,170,0.2)');
        el.textContent = text;
    }

    function handleLogin() {
        var email = document.getElementById('email').value.trim();
        var pw    = document.getElementById('password').value;
        var btn   = document.querySelector('.btn-login-submit');

        var isEn = (window._wlang === 'en' || window._whaliumLang === 'en');
        if (!email) { showMsg(isEn ? 'Please enter your email address' : '请输入邮箱地址', 'error'); return; }
        if (!pw)    { showMsg(isEn ? 'Please enter your password' : '请输入密码', 'error'); return; }
        if (!/\S+@\S+\.\S+/.test(email)) { showMsg(isEn ? 'Invalid email format' : '邮箱格式不正确', 'error'); return; }

        btn.textContent = isEn ? 'Signing in…' : '登录中…'; btn.style.opacity = '0.7';

        // Demo：模拟登录成功后跳回列表页
        setTimeout(function() {
            showMsg(isEn ? '✓ Signed in, redirecting…' : '✓ 登录成功，正在跳转…', 'success');
            btn.textContent = isEn ? '✓ Signed In' : '✓ 登录成功';
            btn.style.background = 'linear-gradient(135deg,#1a8a4a,#0d6640)';
            btn.style.opacity = '1';
            setTimeout(function() {
                window.location.href = 'whalium_1_index.html';
            }, 1000);
        }, 900);
    }

    function handleWechat() {
        var isEn = (window._wlang === 'en' || window._whaliumLang === 'en');
        showMsg(isEn ? 'WeChat login coming soon' : '微信登录功能开发中，敬请期待', 'info');
    }

    // 回车提交
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    </script>

  /* Sort by length descending — replace longer strings first to avoid partial matches */
  MAP.sort(function(a,b){ return b[0].length - a[0].length; });

  function walkAndReplace(root, toEn) {
    /* Text nodes */
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while((node = walker.nextNode())) {
      var parent = node.parentNode;
      if(!parent) continue;
      var tag = parent.tagName;
      if(tag==='SCRIPT'||tag==='STYLE') continue;
      var txt = node.nodeValue;
      if(!/[一-鿿]/.test(txt)) continue;
      var replaced = txt;
      for(var i=0;i<MAP.length;i++) {
        if(replaced.indexOf(MAP[i][0]) !== -1) {
          replaced = replaced.split(MAP[i][toEn?0:1]).join(MAP[i][toEn?1:0]);
        }
      }
      if(replaced !== txt) node.nodeValue = replaced;
    }
    /* Option elements (select dropdowns) */
    root.querySelectorAll('option').forEach(function(opt) {
      var txt = opt.textContent;
      if(!/[一-鿿]/.test(txt)) return;
      var replaced = txt;
      for(var i=0;i<MAP.length;i++) {
        if(replaced.indexOf(MAP[i][0]) !== -1) {
          replaced = replaced.split(MAP[i][toEn?0:1]).join(MAP[i][toEn?1:0]);
        }
      }
      if(replaced !== txt) opt.textContent = replaced;
    });
    /* Placeholder attributes */
    root.querySelectorAll('[placeholder]').forEach(function(el) {
      var txt = el.placeholder;
      if(!/[一-鿿]/.test(txt)) return;
      var replaced = txt;
      for(var i=0;i<MAP.length;i++) {
        replaced = replaced.split(MAP[i][toEn?0:1]).join(MAP[i][toEn?1:0]);
      }
      if(replaced !== txt) el.placeholder = replaced;
    });
    /* Title / aria-label attributes */
    root.querySelectorAll('[title],[aria-label]').forEach(function(el) {
      ['title','aria-label'].forEach(function(attr) {
        var txt = el.getAttribute(attr)||'';
        if(!/[一-鿿]/.test(txt)) return;
        var replaced = txt;
        for(var i=0;i<MAP.length;i++) {
          replaced = replaced.split(MAP[i][toEn?0:1]).join(MAP[i][toEn?1:0]);
        }
        if(replaced !== txt) el.setAttribute(attr, replaced);
      });
    });
  }

  /* Hook into the applyLang system */
  var _orig = window.applyLang;
  window.applyLang = function(lang) {
    if(_orig) _orig(lang);
    walkAndReplace(document.body||document.documentElement, lang==='en');
  };

  /* Also run on DOMContentLoaded after .t spans have been applied */
  document.addEventListener('DOMContentLoaded', function() {
    var lang = 'zh';
    try { lang = localStorage.getItem('whalium_lang') || window._wlang || 'zh'; } catch(e) {}
    if(lang === 'en') walkAndReplace(document.body, true);
  });
})();
